; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = 
	nano_atmega328_new
src_dir = .
include_dir = .

[nano_common]
platform = atmelavr
framework = arduino
; extra_scripts = pre:scripts/copy_firmware.py
lib_deps = 
	;lib_custom/neededLib
build_flags = 
	-std=c++17 ${env.build_flags}
monitor_speed = 115200
monitor_echo = yes

[env]
build_flags = -Wall -Wextra

[env:nano_atmega_168]
board = nanoatmega168
extends = nano_common

[env:nano_atmega_328]
; old Bootloader
board = nanoatmega328
extends = nano_common

[env:nano_atmega328_new]
; new Bootloader
board = nanoatmega328new
extends = nano_common
